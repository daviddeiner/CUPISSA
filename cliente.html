<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUPISSA - Mi Crédito</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="logo.png" alt="CUPISSA Logo" onerror="this.style.display='none'">
      <h2 style="color: var(--primary-dark);">CUPISSA</h2>
    </div>
    <button id="btn-logout" class="btn btn-secondary" style="width: auto;">Cerrar Sesión</button>
  </header>

  <div class="container">
    <div class="card">
      <h3>Hola, <span id="client-name">---</span></h3>
    </div>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-title">Cupo Disponible</div>
        <div class="metric-value" id="cupo-disponible">$0</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Deuda Actual</div>
        <div class="metric-value" id="deuda-actual">$0</div>
      </div>
    </div>

    <div id="nodebt-card" class="card hidden" style="text-align: center;">
      <h3 style="color: var(--success);">¡Estás al día!</h3>
      <p style="color: var(--text-muted); margin-top: 0.5rem;">No tienes ninguna deuda activa actualmente.</p>
    </div>

    <div id="expiration-card" class="card">
      <h4>Próximo Vencimiento</h4>
      <p id="proximo-vencimiento" style="font-size: 1.25rem; font-weight: 600; margin-top: 0.5rem;">---</p>
      <p class="text-note">Se incrementa por días de retraso</p>
    </div>

    <div id="action-card" class="card">
      <h4>Realizar Pago</h4>
      <div style="display: flex; gap: 1rem; margin: 1rem 0;">
        <button class="btn btn-secondary" onclick="selectPayOption('min')">
          Pagar Cuota Mínima (<span id="cuota-minima-val">$0</span>)
        </button>
        <button class="btn btn-secondary" onclick="selectPayOption('total')">Pagar Deuda Total</button>
      </div>

      <div class="form-group">
        <label>Monto a Pagar</label>
        <input type="number" id="monto-pagar" class="form-control" readonly>
      </div>

      <button class="btn" onclick="processPayment()">Pagar con Wompi</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/cliente.js"></script>
</body>
</html>
