<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUPISSA - Iniciar Sesión</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="logo.png" alt="CUPISSA Logo" onerror="this.style.display='none'">
      <h2 style="color: var(--primary-dark);">CUPISSA</h2>
    </div>
  </header>

  <div class="container" style="max-width: 400px; margin-top: 4rem;">
    <div class="card">
      <h3 style="text-align: center; margin-bottom: 1.5rem; color: var(--primary-dark);">Acceso a Clientes</h3>
      <form id="login-form">
        <div class="form-group">
          <label for="phone">Teléfono Móvil</label>
          <input type="tel" id="phone" class="form-control" placeholder="Ej: 3001234567" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn">Ingresar</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
